<!DOCTYPE html>
<html>
<head>
    <title>Product Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Product Management System</h1>
        <p>View and add products using Express API</p>
    </header>

    <div class="container">

        <h2>Add New Product</h2>

        <form id="productForm">
            <input
                type="text"
                id="name"
                placeholder="Product Name"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Product Price"
                min="0"
                step="0.01"
                required
            >

            <input
                type="number"
                id="rating"
                placeholder="Rating (0-5)"
                min="0"
                max="5"
                step="0.1"
                required
            >

            <button type="submit">Add Product</button>
        </form>

        <p id="message"></p>

        <h2>All Products</h2>

        <div id="productList" class="product-list">
            Loading products...
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
